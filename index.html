<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Techno Games</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fondo de cuadrícula Cyberpunk -->
    <div class="cyber-grid"></div>

    <div class="login-container drop-anim">
        <div class="hologram-icon">
            <i class="fa-solid fa-user-ninja"></i>
        </div>
        
        <h1 class="cyber-title" data-text="ACCESO">ACCESO <span>SENA</span></h1>
        <p class="subtitle">Identificación Requerida</p>
        
        <div class="input-box">
            <i class="fa-solid fa-terminal"></i>
            <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="off">
            <div class="scan-line"></div>
        </div>
        
        <div class="input-box">
            <i class="fa-solid fa-fingerprint"></i>
            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña">
            <div class="scan-line"></div>
        </div>

        <p id="mensaje-error" class="error-text">ERROR: Acceso denegado.</p>

        <button id="btn-aceptar" class="cyber-btn" onclick="iniciarSesion()">
            ACEPTAR <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
    </div>

    <script src="login.js"></script>
</body>
</html>
