<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya - Premium</title>
    <link rel="stylesheet" href="triqui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="game-container">
        <h1>Tres en Raya</h1>
        
        <div class="status-turn" id="status">Turno de <span>X</span></div>

        <div class="scoreboard">
            <div class="score-box player-x">
                <span class="label">Jugador X</span>
                <span class="score" id="score-x">0</span>
            </div>
            <div class="score-box ties">
                <span class="label">Empates</span>
                <span class="score" id="score-ties">0</span>
            </div>
            <div class="score-box player-o">
                <span class="label">Jugador O</span>
                <span class="score" id="score-o">0</span>
            </div>
        </div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="restart-btn"><i class="fa-solid fa-arrow-rotate-right"></i> Reiniciar Partida</button>
    </div>

    <script src="triqui.js"></script>
</body>
</html>
